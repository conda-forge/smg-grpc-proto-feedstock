schema_version: 1

context:
  version: "0.5.0"

package:
  name: smg-grpc-proto
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/s/smg-grpc-proto/smg_grpc_proto-${{ version }}.tar.gz
    sha256: cb5a23dd915cc93d67e0aba73bbb89d86ec55f88159fa2cfaf3c5398b3ffaa0d
  - url: https://raw.githubusercontent.com/lightseekorg/smg/main/LICENSE
    sha256: be6e05da66141329ef9b092cf9561889baea1aa630576907dda3ec214f8da4eb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=68.0
    - grpcio-tools >=1.81.1
    - pip
  run:
    - python >=${{ python_min }}
    - grpcio >=1.81.1
    - protobuf >=6.33.5
tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - '*'
      imports:
        - smg_grpc_proto
      pip_check: true

about:
  summary: SMG gRPC proto definitions for vLLM, TRT-LLM, MLX, TokenSpeed, and SGLang
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/lightseekorg/smg

extra:
  recipe-maintainers:
    - xhochy
